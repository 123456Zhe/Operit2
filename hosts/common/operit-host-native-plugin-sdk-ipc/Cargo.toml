[package]
name = "operit-host-native-plugin-sdk-ipc"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Native Plugin SDK IPC carriers for Operit hosts."

[dependencies]
operit-host-api = { path = "../../../core/crates/foundation/host-api" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
